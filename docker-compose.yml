services:
  postgresdb:
    image: postgres:16-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: klustudentdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - springboot-postgres-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d klustudentdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./STUDENTAPI-SPRINGBOOT
      dockerfile: backend.Dockerfile
    container_name: docker-springboot
    ports:
      - "2025:2000"
    depends_on:
      postgresdb:
        condition: service_healthy
    restart: on-failure
    networks:
      - springboot-postgres-net

  frontend:
    build:
      context: ./STUDENTAPI-REACT
      dockerfile: frontend.Dockerfile
    container_name: docker-react
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: on-failure
    networks:
      - springboot-postgres-net

volumes:
  postgres_data:

networks:
  springboot-postgres-net:
